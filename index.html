const key='my-life-radar-v1-state';let stored={};try{stored=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}const state={page:'home',filter:'all',read:stored.read||{},saved:stored.saved||{},seenChange:stored.seenChange||{}};const $=id=>document.getElementById(id);const persist=()=>localStorage.setItem(key,JSON.stringify({read:state.read,saved:state.saved,seenChange:state.seenChange}));const scope=()=>records.filter(r=>state.page==='home'||r.cat===state.page);const label=cat=>categories.find(c=>c[0]===cat)?.[1]||cat;const changed=r=>r.change&&!state.seenChange[r.id];const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){ $('nav').innerHTML=categories.map(([id,name])=>`<button data-page="${id}" class="${state.page===id?'active':''}">${name}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;state.filter='all';$('search').value='';render()});const name=label(state.page);$('scope').textContent=state.page==='home'?'全站最新动态':name+' · 分类情报';$('headline').textContent=state.page==='home'?'今天有什么值得关注？':name;$('subhead').textContent=state.page==='home'?'全站最新、未读、收藏与有变化的资讯集中查看。':'当前所有筛选只作用于「'+name+'」栏目。';$('scopeName').textContent=state.page==='home'?'· 全站':'· '+name;const s=scope();const filters=[['all','全部',r=>true],['unread','未读',r=>!state.read[r.id]],['read','已读',r=>!!state.read[r.id]],['saved','收藏',r=>!!state.saved[r.id]],['changed','新变化',r=>changed(r)]];$('stats').innerHTML=filters.map(([id,n,fn])=>`<div role="button" tabindex="0" data-filter="${id}" class="stat ${state.filter===id?'active':''}"><b>${s.filter(fn).length}</b><span>${n}</span></div>`).join('');document.querySelectorAll('[data-filter]').forEach(el=>{el.onclick=()=>{state.filter=el.dataset.filter;render()};el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}}});const f=filters.find(x=>x[0]===state.filter)[2];let items=s.filter(f).filter(r=>(r.title+r.summary).toLowerCase().includes($('search').value.toLowerCase()));$('sectionTitle').textContent=(state.page==='home'?'全站资讯':name)+' · '+filters.find(x=>x[0]===state.filter)[1];$('resultCount').textContent='共 '+items.length+' 条演示资讯';$('list').innerHTML=items.length?items.map(r=>`<article class="item"><div class="item-top"><div class="chips"><span class="chip">${label(r.cat)}</span><span class="chip ${state.read[r.id]?'':'unread'}">${state.read[r.id]?'已读':'未读'}</span>${changed(r)?'<span class="chip changed">有新变化</span>':''}</div><button class="bookmark ${state.saved[r.id]?'saved':''}" aria-label="收藏或取消收藏" data-save="${r.id}">${state.saved[r.id]?'★':'☆'}</button></div><h3>${escapeHtml(r.title)}</h3><p>${escapeHtml(r.summary)}</p><div class="item-foot"><span class="foot">${state.read[r.id]?'最近阅读：'+new Date(state.read[r.id]).toLocaleString('zh-CN',{timeZone:'Asia/Tokyo'}):'尚未阅读'}</span><button class="open" data-open="${r.id}">阅读详情 →</button></div></article>`).join(''):'<div class="panel empty" style="grid-column:1/-1">当前筛选下没有资讯</div>';document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{const id=b.dataset.save;state.saved[id]=!state.saved[id];persist();render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDetail(b.dataset.open))}function openDetail(id){const r=records.find(x=>x.id===id);if(!r)return;const prev=state.read[id];state.read[id]=new Date().toISOString();state.seenChange[id]=true;persist();const time=v=>v?new Date(v).toLocaleString('zh-CN',{timeZone:'Asia/Tokyo',hour12:false})+' JST':'未阅读';$('dialog').innerHTML=`<div class="item-top"><span class="tag">${label(r.cat)} · 演示资讯</span><button class="close" id="closeModal">关闭 ×</button></div><h2 id="detailTitle">${escapeHtml(r.title)}</h2><p>${escapeHtml(r.summary)}</p><div class="notice">这是页面设计示例，不是已经核实的真实活动。正式版会从官方来源提取准确的开始、结束时间和条件。</div><div class="detailrow"><b>开始／结束</b><span>${escapeHtml(r.dates)}</span></div><div class="detailrow"><b>值得关注</b><span>${escapeHtml(r.highlight)}</span></div><div class="detailrow"><b>注意事项</b><span>${escapeHtml(r.warning)}</span></div><div class="detailrow"><b>如何参加</b><span>${escapeHtml(r.steps)}</span></div><div class="detailrow"><b>官方链接</b><span>尚未接入已核实活动页面</span></div><div class="detailrow"><b>上次阅读</b><span>${time(prev)}</span></div><div class="detailrow"><b>本次阅读</b><span>${time(state.read[id])}</span></div><div class="detailrow"><b>内容变化</b><span>${r.change?'示例：此条信息存在更新提示；实际变更内容待接入版本比对。':'暂无变化提示'}</span></div><p><button class="open" id="modalSave">${state.saved[id]?'★ 取消收藏':'☆ 加入收藏'}</button></p>`;$('modal').classList.add('show');$('closeModal').onclick=closeDetail;$('modalSave').onclick=()=>{state.saved[id]=!state.saved[id];persist();openDetail(id)}}function closeDetail(){$('modal').classList.remove('show');render()}$('modal').onclick=e=>{if(e.target===$('modal'))closeDetail()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});$('search').addEventListener('input',render);render();
