'收藏',r=>!!state.saved[r.id]],['changed','新变化',r=>changed(r)]];$('stats').innerHTML=filters.map(([id,n,fn])=>`<div role="button" tabindex="0" data-filter="${id}" class="stat ${state.filter===id?'active':''}"><b>${s.filter(fn).length}</b><span>${n}</span></div>`).join('');document.querySelectorAll('[data-filter]').forEach(el=>{el.onclick=()=>{state.filter=el.dataset.filter;render()};el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}}});const f=filters.find(x=>x[0]===state.filter)[2];let items=s.filter(f).filter(r=>(r.title+r.summary).toLowerCase().includes($('search').value.toLowerCase()));$('sectionTitle').textContent=(state.page==='home'?'全站资讯':name)+' · '+filters.find(x=>x[0]===state.filter)[1];$('resultCount').textContent='共 '+items.length+' 条演示资讯';$('list').innerHTML=items.length?items.map(r=>`<article class="item"><div class="item-top"><div class="chips"><span class="chip">${label(r.cat)}</span><span class="chip">${escapeHtml(r.sub||'其他')}</span><span class="chip ${state.read[r.id]?'':'unread'}">${state.read[r.id]?'已读':'未读'}</span>${changed(r)?'<span class="chip changed">有新变化</span>':''}</div><button class="bookmark ${state.saved[r.id]?'saved':''}" aria-label="收藏或取消收藏" data-save="${r.id}">${state.saved[r.id]?'★':'☆'}</button></div><h3>${escapeHtml(r.title)}</h3><p>${escapeHtml(r.summary)}</p><div class="item-foot"><span class="foot">${state.read[r.id]?'最近阅读：'+new Date(state.read[r.id]).toLocaleString('zh-CN',{timeZone:'Asia/Tokyo'}):'尚未阅读'}</span><button class="open" data-open="${r.id}">阅读详情 →</button></div></article>`).join(''):'<div class="panel empty" style="grid-column:1/-1">当前筛选下没有资讯</div>';document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{const id=b.dataset.save;state.saved[id]=!state.saved[id];persist();render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDetail(b.dataset.open))}function openDetail(id){const r=records.find(x=>x.id===id);if(!r)return;const prev=state.read[id];state.
